micronaut:
  application:
    name: flat-service
  server:
    context-path: /api
    ssl:
      enabled: true
      port: ${HTTPS_PORT}
      key-store:
        path: ${TLS_KEYSTORE_PATH}
        password: ${TLS_KEYSTORE_PASSWORD}
        type: PKCS12
      key:
        alias: flat-service

datasources:
  default:
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    driver-class-name: org.postgresql.Driver

jpa:
  default:
    entity-scan:
      packages:
        - ru.ifmo.se.model
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        hbm2ddl:
          auto: update

jackson:
  serialization:
    WRITE_DATES_AS_TIMESTAMPS: false
  serialization-inclusion: NON_NULL