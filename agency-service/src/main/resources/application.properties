micronaut.application.name=agency-service
openapi-micronaut-client.base-path=https://${FLAT_HOST}:${FLAT_PORT}/${FLAT_CONTEXT_PATH}
app.flat-service.public.url=${FLAT_PUBLIC_URL}
jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
jackson.serialization-inclusion=NON_NULL

micronaut.server.context-path=/api

micronaut.http.client.ssl.enabled=true
micronaut.http.client.ssl.trust-store.path=${TLS_TRUSTSTORE_PATH}
micronaut.http.client.ssl.trust-store.password=${TLS_TRUSTSTORE_PASSWORD}
micronaut.http.client.ssl.trust-store.type=PKCS12

micronaut.server.ssl.enabled=true
micronaut.server.ssl.port=${HTTPS_PORT}
micronaut.server.ssl.key-store.path=${TLS_KEYSTORE_PATH}
micronaut.server.ssl.key-store.password=${TLS_KEYSTORE_PASSWORD}
micronaut.server.ssl.key-store.type=PKCS12
micronaut.server.ssl.key.alias=agency-service