<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flat and Agency APIs</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.32.11/swagger-ui.css">
  </head>
  <body>
    <h1>Flats</h1>
    <div id="swagger-ui-flats"></div>
    <h1>Agency</h1>
    <div id="swagger-ui-agency"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5.32.11/swagger-ui-bundle.js"></script>
    <script>
      window.addEventListener("load", () => {
        SwaggerUIBundle({
          url: "./flat-service.yml",
          dom_id: "#swagger-ui-flats"
        });
        SwaggerUIBundle({
          url: "./agency-service.yml",
          dom_id: "#swagger-ui-agency"
        });
      });
    </script>
  </body>
</html>
