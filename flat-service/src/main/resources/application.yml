micronaut:
  application:
    name: flat-service
  server:
    context-path: /api

datasources:
  default:
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    driver-class-name: org.postgresql.Driver

jpa:
  default:
    entity-scan:
      packages:
        - ru.ifmo.se.model
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        hbm2ddl:
          auto: update
